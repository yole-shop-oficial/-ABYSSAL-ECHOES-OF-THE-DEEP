<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
  <meta name="theme-color" content="#040812"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="ABYSSAL"/>
  <title>ABYSSAL ECHOES OF THE DEEP</title>
  <link rel="icon" type="image/svg+xml" href="/icon-192.svg"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #040812;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      top: 0; left: 0;
    }
    #ui-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #040812;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 24px;
    }
    #loading-screen.hidden { display: none; }
    .load-logo {
      width: 90px; height: 90px;
      animation: pulse-logo 2s ease-in-out infinite;
    }
    .load-title {
      font-size: clamp(1.2rem, 5vw, 2rem);
      font-weight: 900;
      letter-spacing: .08em;
      background: linear-gradient(90deg, #00c8ff, #7b2fff, #ff3a6e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      line-height: 1.2;
    }
    .load-subtitle {
      font-size: .75rem;
      letter-spacing: .3em;
      color: #00c8ff;
      opacity: .7;
      text-transform: uppercase;
    }
    .load-bar-wrap {
      width: min(300px, 80vw);
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      overflow: hidden;
    }
    .load-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00c8ff, #7b2fff);
      border-radius: 100px;
      transition: width .3s ease;
    }
    .load-status {
      font-size: .78rem;
      color: rgba(200,216,240,0.5);
      letter-spacing: .05em;
    }
    @keyframes pulse-logo {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 8px #00c8ff55); }
      50% { opacity: .85; transform: scale(1.04); filter: drop-shadow(0 0 22px #7b2fff88); }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <svg class="load-logo" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="lg1" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#7b2fff" stop-opacity=".4"/>
          <stop offset="100%" stop-color="#040812" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00c8ff"/>
          <stop offset="50%" stop-color="#7b2fff"/>
          <stop offset="100%" stop-color="#ff3a6e"/>
        </linearGradient>
      </defs>
      <circle cx="45" cy="45" r="44" fill="url(#lg1)"/>
      <ellipse cx="45" cy="45" rx="35" ry="35" stroke="rgba(0,200,255,0.15)" stroke-width="1"/>
      <!-- Rift shape -->
      <path d="M12 45 Q26 24 45 45 Q64 66 78 45" stroke="url(#lg2)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M12 45 Q26 66 45 45 Q64 24 78 45" stroke="url(#lg2)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".4"/>
      <!-- Eye -->
      <ellipse cx="45" cy="45" rx="9" ry="9" fill="url(#lg2)" opacity=".8"/>
      <ellipse cx="45" cy="45" rx="4" ry="4" fill="#040812"/>
      <ellipse cx="43" cy="43" rx="1.5" ry="1.5" fill="rgba(255,255,255,0.6)"/>
      <!-- Rune marks -->
      <circle cx="16" cy="45" r="2.5" fill="#00c8ff" opacity=".8"/>
      <circle cx="74" cy="45" r="2.5" fill="#ff3a6e" opacity=".8"/>
      <circle cx="45" cy="16" r="2" fill="#7b2fff" opacity=".6"/>
      <circle cx="45" cy="74" r="2" fill="#7b2fff" opacity=".6"/>
    </svg>
    <div class="load-title">ABYSSAL ECHOES<br/>OF THE DEEP</div>
    <div class="load-subtitle">Las Brechas han abierto el mundo</div>
    <div class="load-bar-wrap"><div class="load-bar" id="loadBar"></div></div>
    <div class="load-status" id="loadStatus">Iniciando el abismo...</div>
  </div>

  <div id="game-container"></div>
  <div id="ui-overlay"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
